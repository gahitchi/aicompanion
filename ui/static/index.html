<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jade</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="stage">
  <div class="sphere-wrap" id="sphere-wrap" data-state="idle" data-tone="neutral" data-mode="casual">
    <div class="halo"></div>
    <div class="sphere">
      <div class="core"></div>
      <div class="shimmer"></div>
    </div>
  </div>

  <div class="caption">
    <div class="state-text" id="state-text">idle</div>
    <div class="meta-text">
      <span id="tone-text">neutral</span>
      <span class="dot">·</span>
      <span id="mode-text">casual</span>
      <span class="dot">·</span>
      <span id="wake-text">asleep</span>
    </div>
  </div>

  <div class="latest" id="latest"></div>

  <details class="history">
    <summary>conversation</summary>
    <div id="log"></div>
  </details>
</main>

<script src="app.js"></script>
</body>
</html>
