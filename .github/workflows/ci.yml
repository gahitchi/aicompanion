name: cross-platform

# Proves the OS-integration layer imports and builds correct per-OS artifacts
# on Windows, macOS, and Linux. It does NOT install the heavy ML stack
# (torch / faster-whisper / chromadb / kokoro) — that download is multi-GB and
# needs system audio libs; it's validated by running the real installer. This
# job exists to catch a Windows/macOS-only import error or a broken autostart
# builder before a user hits it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  import-smoke:
    name: import + autostart (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cross-platform smoke test
        run: python tests/test_cross_platform.py

  installer-syntax:
    name: installer + scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Compile every module so a syntax error anywhere fails CI, even in
      # files the import-smoke doesn't exercise.
      - name: Byte-compile all Python
        run: python -m compileall -q core tools voice ui installer *.py

      # The bash bootstrap must be valid shell.
      - name: Shell-check install.sh syntax
        run: bash -n install.sh

      # The PowerShell bootstrap must parse (pwsh ships on the Linux runner).
      - name: Parse install.ps1 syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$null)
          Write-Host "install.ps1 parsed OK"
